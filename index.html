<!DOCTYPE html>
<html>

<head>

<title>20 Marker Quote Database</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

body{
font-family: Arial, sans-serif;
margin:40px;
background:#fafafa;
}

h1{
margin-bottom:20px;
}

button{
padding:10px 20px;
margin:10px;
font-size:16px;
cursor:pointer;
}

#searchBar{
margin:20px 0;
padding:10px;
width:320px;
font-size:16px;
}

#cardContainer{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(350px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:10px;
padding:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.quote{
font-size:18px;
margin-bottom:12px;
}

.meta{
font-size:14px;
color:#444;
margin-top:6px;
}

.theme{
display:inline-block;
background:#e6eefc;
padding:4px 8px;
margin:4px 4px 0 0;
border-radius:6px;
font-size:13px;
}

#backButton{
margin-bottom:20px;
}

</style>

</head>

<body>

<h1>20 Marker Quote Database</h1>

<div id="selection">

<p>Select a text:</p>

<button onclick="loadText('tacitus_quotes.csv','Tacitus – Annals')">
Tacitus – Annals XIII and XIV
</button>

<button onclick="loadText('aeneid_quotes.csv','Virgil – Aeneid II')">
Virgil – Aeneid II
</button>

</div>

<div id="quoteView" style="display:none;">

<button id="backButton" onclick="goBack()">← Back</button>

<h2 id="pageTitle"></h2>

<input type="text" id="searchBar"
placeholder="Search section or theme..."
onkeyup="filterQuotes()">

<div id="cardContainer"></div>

</div>

<script>

/* THEME KEY → DESCRIPTION DICTIONARY */

const themeMap = {

"POW":"Agrippina's desire for power",
"INC":"Nero’s incompetence, ineptitude, reliance on advisors and impotence",
"HOR":"Horrors and brutality of warfare",
"VAL":"Valour, patriotism, and courage in battle"

}

/* DATA STORAGE */

let quoteData = []

/* LOAD CSV */

function loadText(csvFile,title){

document.getElementById("selection").style.display="none"
document.getElementById("quoteView").style.display="block"
document.getElementById("pageTitle").innerText=title

Papa.parse(csvFile,{

download:true,
header:true,

complete:function(results){

quoteData = results.data
renderCards(quoteData)

}

})

}

/* PARSE THEMES */

function parseThemes(themeString){

if(!themeString) return []

return themeString.split(/[;, ]+/).map(key=>{

key = key.trim()

return themeMap[key] || key

})

}

/* CREATE CARDS */

function renderCards(data){

let container = document.getElementById("cardContainer")

container.innerHTML = ""

data.forEach(row => {

if(!row.quote) return  // skip empty rows

let card = document.createElement("div")
card.className = "card"

let themes = parseThemes(row.themes)

let themeHTML = themes.map(t => `<span class="theme">${t}</span>`).join("")

card.innerHTML =

`<div class="quote">${row.quote}</div>

<div class="meta"><strong>Section:</strong> ${row.section}</div>

<div class="meta"><strong>Themes:</strong><br>${themeHTML}</div>

<div class="meta"><strong>Notes:</strong> ${row.notes || ""}</div>`

container.appendChild(card)

})

}

/* SEARCH */

function filterQuotes(){

let query=document.getElementById("searchBar").value.toLowerCase()

let filtered = quoteData.filter(row=>{

let themes=parseThemes(row.themes).join(" ").toLowerCase()

return(

row.section.toLowerCase().includes(query) ||

themes.includes(query)

)

})

renderCards(filtered)

}

/* BACK BUTTON */

function goBack(){

document.getElementById("quoteView").style.display="none"
document.getElementById("selection").style.display="block"
document.getElementById("searchBar").value=""

}

</script>

</body>
</html>
