<!DOCTYPE html>
<html>

<head>

<title>20 Marker Quote Database</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

body{
font-family: Arial, sans-serif;
margin:40px;
background:#fafafa;
}

h1{
margin-bottom:20px;
}

button{
padding:10px 20px;
margin:10px;
font-size:16px;
cursor:pointer;
}

#searchBar{
margin:20px 0;
padding:10px;
width:320px;
font-size:16px;
}

#cardContainer{
column-width:350px;
column-gap:20px;
}

.card{
background:white;
border-radius:10px;
padding:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);

break-inside:avoid;
margin-bottom:20px;

opacity:0;
transform:translateY(10px);
animation:fadeIn 0.5s ease forwards;
}

@keyframes fadeIn{
to{
opacity:1;
transform:translateY(0);
}
}

.quote{
font-size:18px;
margin-bottom:12px;
}

.meta{
font-size:14px;
color:#444;
margin-top:6px;
}

.theme{
display:inline-block;
background:#e6eefc;
padding:4px 8px;
margin:4px 4px 0 0;
border-radius:6px;
font-size:13px;
cursor:pointer;
transition:background 0.2s;
}

#themeButtons{
margin:10px 0 20px 0;
}

#themeButtons button{
margin:4px;
padding:6px 10px;
border-radius:6px;
border:none;
background:#e6eefc;
cursor:pointer;
}

#themeButtons button:hover{
background:#cfdcff;
}

.theme:hover{
background:#cfdcff;
}

#backButton{
margin-bottom:20px;
}

#sectionStats{
margin:10px 0 20px 0;
max-width:500px;
}

.statRow{
display:flex;
align-items:center;
gap:10px;
}

.statLabel{
font-size:14px;
width:70px;
text-align:center;
}

.statBar{
flex:1;
height:14px;
background:#eee;
border-radius:8px;
overflow:hidden;
display:flex;
}

.statBlue{
background:#4a90e2;
height:100%;
}

.statRed{
background:#e24a4a;
height:100%;
}

</style>

</head>

<body>

<h1>20 Marker Quote Database</h1>

<div id="selection">

<p>Select a text:</p>

<button onclick="loadText('tacitus_quotes.csv','Tacitus – Annals')">
Tacitus – Annals XIII and XIV
</button>

<button onclick="loadText('aeneid_quotes.csv','Virgil – Aeneid II')">
Virgil – Aeneid II
</button>

</div>

<div id="quoteView" style="display:none;">

<button id="backButton" onclick="goBack()">← Back</button>

<h2 id="pageTitle"></h2>

<div id="sectionStats"></div>

<input type="text" id="searchBar"
placeholder="Search section or theme..."
onkeyup="filterQuotes()">

<div id="themeButtons"></div>

<div id="cardContainer"></div>

</div>

<script>

/* THEME KEY → DESCRIPTION DICTIONARY */

const themeMap = {

"POW":"Agrippina's desire for power",
"INC":"Nero’s incompetence, ineptitude, reliance on advisors and impotence",
"HOR":"Horrors and brutality of warfare",
"VAL":"Valour, patriotism, and courage in battle",
"PER":"Personal grief",
"FAT":"Fate and the intervention of the gods",
"MOR":"Morality in warfare: deception and revenge",
"FUT":"Futility and weakness of the Trojans",
"INN":"Violation of innocents (women etc.) and sacred sites",
"LEG":"Loss of the Trojan’s legacy",
"IMM":"Nero's immorality and evil",
"PRV":"Perversion of Nero and Agrippina's relationship",
"MAN":"Manipulation and control of/power over Nero",
"CUN":"Agrippina’s cunning, resourcefulness"

}

const sectionLabels = {

"L":"Latin",
"E":"English",
"13":"Book 13",
"14":"Book 14"

}

/* DATA STORAGE */

let quoteData = []

/* LOAD CSV */

function loadText(csvFile,title){

document.getElementById("selection").style.display="none"
document.getElementById("quoteView").style.display="block"
document.getElementById("pageTitle").innerText=title

Papa.parse(csvFile,{

download:true,
header:true,

complete:function(results){

quoteData = results.data
  .filter(row => row.quote) // remove empty rows
  .map(row => ({
    ...row,
    parsedThemes: parseThemes(row.themes)
  }))
generateThemeButtons()
generateSectionStats()
renderCards(quoteData)

}

})

}

/* PARSE THEMES */

function parseThemes(themeString){

if(!themeString) return []

return themeString.split(/[;, ]+/).map(key=>{

key = key.trim()

return themeMap[key] || key

})

}

/* CREATE CARDS */

function renderCards(data){

let container = document.getElementById("cardContainer")

container.innerHTML = ""

data.forEach((row, index) => {

if(!row.quote) return  // skip empty rows

let card = document.createElement("div")
card.className = "card"
  
let columns = getColumnCount()

let ind_col = Math.floor(index / columns)
let ind_row = index % columns

let visualIndex = ind_row * columns + ind_col

card.style.animationDelay = (visualIndex * 0.05) + "s"

let themes=row.parsedThemes

let themeHTML=themes.map(t=>`<span class="theme" onclick="filterByTheme('${t}')">${t}</span>`).join("")

let notesHTML = ""

if(row.notes && row.notes.trim() !== ""){
notesHTML = `<div class="meta"><strong>Notes:</strong> ${row.notes}</div>`
}

card.innerHTML =

`<div class="quote">“${row.quote}”</div>

<div class="meta"><strong>Section:</strong> ${sectionLabels[row.section] || row.section}</div>

<div class="meta"><strong>Themes:</strong><br>${themeHTML}</div>

<div class="meta">${notesHTML}</div>`

container.appendChild(card)

})

}

function getColumnCount(){

let container = document.getElementById("cardContainer")

let containerWidth = container.offsetWidth

let columnWidth = 350
let columnGap = 20

let columns = Math.floor((containerWidth + columnGap) / (columnWidth + columnGap))

return Math.max(columns,1)

}

/* SEARCH */

function filterQuotes(){

let query=document.getElementById("searchBar").value.toLowerCase()

let filtered = quoteData.filter(row=>{

let themes=row.parsedThemes.join(" ").toLowerCase()

return(

row.section.toLowerCase().includes(query) ||

themes.includes(query)

)

})

renderCards(filtered)

}

function filterByTheme(theme){

let filtered = quoteData.filter(row => {

let themes = parseThemes(row.themes)

document.getElementById("searchBar").value = theme

return row.parsedThemes.includes(theme)

})

renderCards(filtered)

}

function generateThemeButtons(){

let container = document.getElementById("themeButtons")

container.innerHTML = ""

let themeSet = new Set()

quoteData.forEach(row => {
row.parsedThemes.forEach(t => themeSet.add(t))
})

themeSet.forEach(theme => {

let btn = document.createElement("button")

btn.innerText = theme

btn.onclick = () => filterByTheme(theme)

container.appendChild(btn)

})

}

function generateSectionStats(){

let container = document.getElementById("sectionStats")

let blueCount = 0
let redCount = 0

quoteData.forEach(row => {

if(row.section === "E" || row.section === "13"){
blueCount++

}else if(row.section === "L" || row.section === "14"){
redCount++
}

})

let total = blueCount + redCount

if(total === 0){
container.innerHTML = ""
return
}

let bluePercent = Math.round((blueCount / total) * 100)
let redPercent = 100 - bluePercent

let blueLabel = (quoteData[0].section === "13" || quoteData[0].section === "14")
? "Book 13"
: "English"

let redLabel = (quoteData[0].section === "13" || quoteData[0].section === "14")
? "Book 14"
: "Latin"

container.innerHTML =

`<div class="statRow">

<span class="statLabel">${bluePercent}%<br>${blueLabel}</span>

<div class="statBar">
<div class="statBlue" style="width:${bluePercent}%"></div>
<div class="statRed" style="width:${redPercent}%"></div>
</div>

<span class="statLabel">${redPercent}%<br>${redLabel}</span>

</div>`
}

/* BACK BUTTON */

function goBack(){

document.getElementById("quoteView").style.display="none"
document.getElementById("selection").style.display="block"
document.getElementById("searchBar").value=""

}

</script>

</body>
</html>
